flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/img/
    - assets/img/icon.png
    - assets/files/TLINY_terms.txt
    - assets/files/TLINY_commerce.txt
  fonts:
    - family: Melanthios
      fonts:
        - asset: assets/fonts/Melanthios/Melanthios.otf
    # - family: BIZUDPMincho
    #   fonts:
    #     - asset: assets/fonts/BIZUDPMincho/BIZUDPMincho-Regular.ttf
