    # - family: SocialIcons
    #   fonts:
    #     - asset: packages/firebase_ui_auth/fonts/SocialIcons.ttf

flutter_gen:
  integrations:
    flutter_svg: true

flutter_native_splash:
  color: '#F6F6E5'
  image: 'assets/img/icon.png'
  color_dark: '#262626'
  image_dark: 'assets/img/icon.png'
  fullscreen: true
  web: true
  web_image_mode: center
