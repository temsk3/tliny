        - asset: assets/fonts/Melanthios.otf
          weight: 700
    - family: SocialIcons
      fonts:
        - asset: packages/firebase_ui_auth/fonts/SocialIcons.ttf

flutter_gen:
  integrations:
    flutter_svg: true
