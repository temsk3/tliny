name: Security & Code Quality

# プルリクエストとmainブランチへのプッシュ時に実行
on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  schedule:
    # 毎週月曜日の午前2時（JST）に実行
    - cron: '0 17 * * 1'
  workflow_dispatch:

jobs:
  # セキュリティスキャン
  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Flutter依存関係のセキュリティチェック
  flutter_security:
    name: Flutter Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.8'

      - name: Clean Flutter cache
        run: flutter clean
      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check for outdated packages
        run: flutter pub outdated

      - name: Audit Flutter dependencies
        run: flutter pub deps --json | jq '.packages[] | select(.kind == "direct") | .name' | xargs -I {} sh -c 'echo "Checking {}" && flutter pub deps --json | jq ".packages[] | select(.name == \"{}\")"'

  # TypeScript依存関係のセキュリティチェック
  functions_security:
    name: Functions Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Audit npm dependencies
        working-directory: functions
        run: npm audit --audit-level=moderate

      - name: Check for outdated packages
        working-directory: functions
        run: npm outdated || true

  # コード品質チェック
  code_quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean Flutter cache
        run: flutter clean
      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Flutter code complexity check
        run: |
          find lib -name "*.dart" -exec wc -l {} + | sort -n | tail -10
          echo "Files with high complexity detected above"

      - name: TypeScript code complexity check
        working-directory: functions
        run: |
          find src -name "*.ts" -exec wc -l {} + | sort -n | tail -10
          echo "Files with high complexity detected above"

  # 依存関係の更新チェック
  dependency_update:
    name: Dependency Update Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.8'

