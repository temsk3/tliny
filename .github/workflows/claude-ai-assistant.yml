name: Claude AI Assistant

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  respond-to-claude-mention:
    # ClaudeがメンションされているかチェックしてからAIを呼び出す
    if: |
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install axios

      - name: Process with Claude AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const axios = require('axios');

          async function callClaude() {
            const issueBody = process.env.ISSUE_BODY || process.env.COMMENT_BODY;
            const issueTitle = process.env.ISSUE_TITLE || '';
            const issueNumber = process.env.ISSUE_NUMBER;
            const repoOwner = process.env.REPO_OWNER;
            const repoName = process.env.REPO_NAME;

            // Claudeのメンションを含む内容から指示を抽出
            const instruction = issueBody.replace(/@claude/gi, '').trim();

            try {
              // Claude APIを呼び出し
              const response = await axios.post(
                'https://api.anthropic.com/v1/messages',
                {
                  model: 'claude-3-5-sonnet-20241022',
                  max_tokens: 4096,
                  messages: [
                    {
                      role: 'user',
                      content: \`
                        You are an AI assistant helping with a GitHub issue in the \${repoName} repository.

                        Issue Title: \${issueTitle}
                        Issue #\${issueNumber}

                        User Request:
                        \${instruction}

                        Please provide helpful guidance, code suggestions, or solutions as appropriate.
                        Format your response in GitHub-flavored markdown.
                      \`
                    }
                  ]
                },
                {
                  headers: {
                    'x-api-key': process.env.ANTHROPIC_API_KEY,
                    'anthropic-version': '2023-06-01',
                    'content-type': 'application/json'
                  }
                }
              );

              const aiResponse = response.data.content[0].text;

              // GitHubにコメントを投稿
              await axios.post(
                \`https://api.github.com/repos/\${repoOwner}/\${repoName}/issues/\${issueNumber}/comments\`,
                {
                  body: \`## 🤖 Claude AI Response\\n\\n\${aiResponse}\`
                },
                {
                  headers: {
                    Authorization: \`token \${process.env.GITHUB_TOKEN}\`,
                    Accept: 'application/vnd.github.v3+json'
                  }
                }
              );

              console.log('Successfully posted Claude response');
            } catch (error) {
              console.error('Error:', error.response?.data || error.message);

              // エラー時もコメントを投稿
              await axios.post(
                \`https://api.github.com/repos/\${repoOwner}/\${repoName}/issues/\${issueNumber}/comments\`,
                {
                  body: \`## ❌ Error\\n\\nFailed to get response from Claude AI. Please check the API configuration and try again.\`
                },
                {
                  headers: {
                    Authorization: \`token \${process.env.GITHUB_TOKEN}\`,
                    Accept: 'application/vnd.github.v3+json'
                  }
                }
              );
            }
          }

          callClaude().catch(console.error);
          "
        env:
          ISSUE_BODY: ${{ github.event.issue.body || github.event.comment.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}

  analyze-and-create-pr:
    # 特定のラベルがついているissueに対してPRを自動作成
    if: |
      github.event_name == 'issues' &&
      (contains(github.event.issue.labels.*.name, 'auto-fix') ||
       contains(github.event.issue.labels.*.name, 'claude-implement'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install axios @octokit/rest

      - name: Analyze Issue and Create Implementation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const axios = require('axios');
          const { Octokit } = require('@octokit/rest');

          const octokit = new Octokit({
            auth: process.env.GITHUB_TOKEN
          });

          async function analyzeAndImplement() {
            const issueBody = process.env.ISSUE_BODY;
            const issueTitle = process.env.ISSUE_TITLE;
            const issueNumber = process.env.ISSUE_NUMBER;
            const repoOwner = process.env.REPO_OWNER;
            const repoName = process.env.REPO_NAME;

            try {
              // Step 1: Analyze the issue with Claude
              const analysisResponse = await axios.post(
                'https://api.anthropic.com/v1/messages',
                {
                  model: 'claude-3-5-sonnet-20241022',
                  max_tokens: 4096,
                  messages: [
                    {
                      role: 'user',
                      content: \`
                        Analyze this GitHub issue and provide a detailed implementation plan.

                        Issue Title: \${issueTitle}
                        Issue Description: \${issueBody}

                        Please provide:
                        1. A summary of the changes needed
                        2. List of files that need to be modified or created
                        3. Specific code changes required
                        4. Any potential risks or considerations

                        Format your response in a structured way.
                      \`
                    }
                  ]
                },
                {
                  headers: {
                    'x-api-key': process.env.ANTHROPIC_API_KEY,
                    'anthropic-version': '2023-06-01',
                    'content-type': 'application/json'
                  }
                }
              );

              const analysisResult = analysisResponse.data.content[0].text;

              // Step 2: Post analysis as comment
              await octokit.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: issueNumber,
                body: \`## 📋 Implementation Analysis\\n\\n\${analysisResult}\\n\\n---\\n*This analysis was generated by Claude AI*\`
              });

              // Step 3: Create a new branch
              const branchName = \`claude-fix-issue-\${issueNumber}\`;

              // Get the default branch SHA
              const { data: refData } = await octokit.git.getRef({
                owner: repoOwner,
                repo: repoName,
                ref: 'heads/main'
              }).catch(() =>
                octokit.git.getRef({
                  owner: repoOwner,
                  repo: repoName,
                  ref: 'heads/master'
                })
              );

              // Create new branch
              await octokit.git.createRef({
                owner: repoOwner,
                repo: repoName,
                ref: \`refs/heads/\${branchName}\`,
                sha: refData.object.sha
              });

              // Step 4: Create PR
              const { data: pr } = await octokit.pulls.create({
                owner: repoOwner,
                repo: repoName,
                title: \`Fix: \${issueTitle} (Issue #\${issueNumber})\`,
                head: branchName,
                base: 'main',
                body: \`## 🤖 Automated PR by Claude AI\\n\\nThis PR addresses Issue #\${issueNumber}\\n\\n### Analysis:\\n\${analysisResult}\\n\\n### Note:\\nThis PR was automatically generated. Please review carefully before merging.\`,
                draft: true
              });

              // Link PR to issue
              await octokit.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: issueNumber,
                body: \`## 🎯 Pull Request Created\\n\\nI've created PR #\${pr.number} to address this issue.\\n\\nPlease review the proposed changes and provide feedback.\`
              });

              console.log(\`Successfully created PR #\${pr.number}\`);
            } catch (error) {
              console.error('Error:', error.response?.data || error.message);

              await octokit.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: issueNumber,
                body: \`## ❌ Error\\n\\nFailed to create automated PR. Error: \${error.message}\`
              });
            }
          }

          analyzeAndImplement().catch(console.error);
          "
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}