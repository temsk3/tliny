name: Deploy to Firebase

# mainブランチへのマージ時に実行
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # 変更されたファイルを検知
  detect_changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      flutter_changed: ${{ steps.changes.outputs.flutter }}
      functions_changed: ${{ steps.changes.outputs.functions }}
      firebase_config_changed: ${{ steps.changes.outputs.firebase_config }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            flutter:
              - 'lib/**'
              - 'test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'web/**'
              - 'assets/**'
            functions:
              - 'functions/**'
            firebase_config:
              - 'firebase.json'
              - 'firestore.rules'
              - 'firestore.indexes.json'
              - 'storage.rules'

  # Flutterアプリのデプロイ
  deploy_flutter:
    name: Deploy Flutter App
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.flutter_changed == 'true' || needs.detect_changes.outputs.firebase_config_changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.8'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --target lib/main.dart

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TLINY_58DE7 }}'
          channelId: live
          projectId: tliny-58de7

  # Firebase Functionsのデプロイ
  deploy_functions:
    name: Deploy Firebase Functions
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.functions_changed == 'true' || needs.detect_changes.outputs.firebase_config_changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Build TypeScript
        working-directory: functions
        run: npm run build

      - name: Deploy Firebase Functions
        run: |
          cd functions
          npm ci
          npm run build
          firebase deploy --only functions --token ${{ secrets.FIREBASE_TOKEN }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # Firestoreルールのデプロイ
  deploy_firestore:
    name: Deploy Firestore Rules
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.firebase_config_changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Firestore Rules
        run: |
          firebase deploy --only firestore:rules --token ${{ secrets.FIREBASE_TOKEN }}
          firebase deploy --only firestore:indexes --token ${{ secrets.FIREBASE_TOKEN }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
