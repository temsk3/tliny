<!DOCTYPE html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="TLINY - 対面での商品交換のみに対応したバザーアプリ。安全で安心な取引をサポートします。"
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="tliny" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Safari popup blocker prevention -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>TLINY</title>
    <link rel="manifest" href="manifest.json" />

    <!-- Flutter Web設定（Flutter 3.32.5対応） -->
    <script>
      // WebGL警告を抑制（開発環境のみ）
      if (
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1'
      ) {
        const originalWarn = console.warn
        console.warn = function (...args) {
          if (
            args[0] &&
            typeof args[0] === 'string' &&
            (args[0].includes('WEBGL_polygon_mode') ||
              args[0].includes('non-portable extension'))
          ) {
            return // WebGL警告を無視
          }
          originalWarn.apply(console, args)
        }
      }

      // エラーハンドリング
      window.addEventListener('error', function (e) {
        if (e.filename && e.filename.includes('flutter.js.map')) {
          e.preventDefault()
          return false
        }
      })
    </script>

    <!-- Google Sign-In API -->
    <script src="https://apis.google.com/js/platform.js" async defer></script>
    <meta
      name="google-signin-client_id"
      content="736590453040-2fpunln7gljjoaviks28upfq138bn7g1.apps.googleusercontent.com"
    />

    <!-- Google Identity Services API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Safari popup blocker prevention script -->
    <script>
      // Safariでのポップアップブロッカー対策
      function openUrlInSafari(url) {
        if (
          navigator.userAgent.toLowerCase().includes('safari') &&
          !navigator.userAgent.toLowerCase().includes('chrome')
        ) {
          // Safariの場合はwindow.openを使用
          const newWindow = window.open(url, '_blank')
          if (newWindow) {
            console.log('Safari: URL opened successfully')
          } else {
            console.log('Safari: Popup blocked, trying alternative method')
            // ポップアップがブロックされた場合の代替手段
            window.location.href = url
          }
        } else {
          // その他のブラウザは通常の処理
          window.open(url, '_blank')
        }
      }
    </script>
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
      name="viewport"
    />
    <style id="splash-screen-style">
      html {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100%;
        background-color: #f6f6e5;
        background-size: 100% 100%;
      }

      .center {
        margin: 0;
        position: absolute;
        top: 50%;
        left: 50%;
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
      }

      .contain {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .stretch {
        display: block;
        width: 100%;
        height: 100%;
      }

      .cover {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .bottom {
        position: absolute;
        bottom: 0;
        left: 50%;
        -ms-transform: translate(-50%, 0);
        transform: translate(-50%, 0);
      }

      .bottomLeft {
        position: absolute;
        bottom: 0;
        left: 0;
      }

      .bottomRight {
        position: absolute;
        bottom: 0;
        right: 0;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #262626;
        }
      }
    </style>
    <script id="splash-screen-script">
      function removeSplashFromWeb() {
        document.getElementById('splash')?.remove()
        document.getElementById('splash-branding')?.remove()
        document.body.style.background = 'transparent'
      }
    </script>
  </head>
  <body>
    <picture id="splash">
      <source
        srcset="
          splash/img/light-1x.png 1x,
          splash/img/light-2x.png 2x,
          splash/img/light-3x.png 3x,
          splash/img/light-4x.png 4x
        "
        media="(prefers-color-scheme: light)"
      />
      <source
        srcset="
          splash/img/dark-1x.png 1x,
          splash/img/dark-2x.png 2x,
          splash/img/dark-3x.png 3x,
          splash/img/dark-4x.png 4x
        "
        media="(prefers-color-scheme: dark)"
      />
      <img
        class="center"
        aria-hidden="true"
        src="splash/img/light-1x.png"
        alt=""
      />
    </picture>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
